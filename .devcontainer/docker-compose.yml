services:
  tileserver:
    image: maptiler/tileserver-gl:latest
    volumes:
      - ../map-data/mbtiles:/data
    ports:
      - "8080:8080"

  backend:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace/map-demo
    command: sh -c "go mod download && go mod tidy && go run ."
    environment: 
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8081:8081"
    depends_on:
      - tileserver

  frontend:
    image: node:25-bookworm
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace/frontend
    command: sh -c "npm ci || npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment: 
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend