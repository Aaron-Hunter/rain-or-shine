steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_TILE_SERVER_URL=${_VITE_TILE_SERVER_URL}'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - '--build-arg'
      - 'VITE_MAP_CENTER_LNG=174.7633'
      - '--build-arg'
      - 'VITE_MAP_CENTER_LAT=-36.8485'
      - '--build-arg'
      - 'VITE_MAP_ZOOM=16'
      - '-t'
      - '${_IMAGE_NAME}'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_NAME}']

images:
  - '${_IMAGE_NAME}'

options:
  logging: CLOUD_LOGGING_ONLY
